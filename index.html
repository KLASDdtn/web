
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100b1c">
<title>Strength Path</title>
<style>
:root {
  color-scheme: dark;
    --bg: #0b0712;
      --panel: #151020;
        --line: #39294f;
          --text: #f6f0ff;
            --muted: #b7a9ca;
              --purple: #a78bfa;
                --pink: #f472b6;
                }
                * { box-sizing: border-box; }
                body {
                  margin: 0;
                    background: var(--bg);
                      color: var(--text);
                        font-family: system-ui, sans-serif;
                        }
                        header {
                          padding: 24px 18px;
                            background: linear-gradient(135deg,#492578,#100b1c);
                            }
                            header h1 { margin-bottom: 5px; }
                            main { max-width: 720px; margin: auto; padding: 16px; }
                            .card {
                              background: var(--panel);
                                border: 1px solid var(--line);
                                  border-radius: 18px;
                                    padding: 16px;
                                      margin-bottom: 14px;
                                      }
                                      button, input, textarea, select { font: inherit; }
                                      button {
                                        padding: 10px 14px;
                                          border: 0;
                                            border-radius: 10px;
                                              background: var(--purple);
                                                color: #170d24;
                                                  font-weight: bold;
                                                    cursor: pointer;
                                                    }
                                                    input, textarea, select {
                                                      width: 100%;
                                                        padding: 10px;
                                                          margin: 6px 0 12px;
                                                            border: 1px solid var(--line);
                                                              border-radius: 10px;
                                                                background: var(--bg);
                                                                  color: var(--text);
                                                                  }
                                                                  label { color: var(--muted); font-size: 13px; }
                                                                  .stat { font-size: 32px; font-weight: bold; }
                                                                  .bar {
                                                                    height: 7px;
                                                                      border-radius: 10px;
                                                                        background: #30213f;
                                                                          overflow: hidden;
                                                                          }
                                                                          .fill {
                                                                            height: 100%;
                                                                              background: linear-gradient(90deg,var(--purple),var(--pink));
                                                                              }
                                                                              .task {
                                                                                display: flex;
                                                                                  align-items: flex-start;
                                                                                    gap: 10px;
                                                                                      padding: 10px 0;
                                                                                        border-bottom: 1px solid var(--line);
                                                                                        }
                                                                                        .task input { width: auto; }
                                                                                        .done { text-decoration: line-through; color: var(--muted); }
                                                                                        small { color: var(--muted); }
                                                                                        </style>
                                                                                        </head>
                                                                                        <body>
                                                                                        <header>
                                                                                          <div>✦ STRENGTH PATH</div>
                                                                                            <h1>เติบโตในแบบของคุณ ✨</h1>
                                                                                              <p>รู้จักตัวเอง · ฝึกทีละนิด · เห็นพัฒนาการ</p>
                                                                                              </header>

                                                                                              <main>
                                                                                                <section class="card">
                                                                                                    <small>คะแนนเฉลี่ยทักษะ</small>
                                                                                                        <div class="stat" id="average">5.8 / 10</div>
                                                                                                            <p id="summary">เริ่มพัฒนาตัวเองได้ตั้งแต่วันนี้</p>
                                                                                                              </section>

                                                                                                                <section class="card">
                                                                                                                    <h2>แผนที่ทักษะ</h2>
                                                                                                                        <div id="skills"></div>
                                                                                                                            <button id="saveScores">บันทึกคะแนน</button>
                                                                                                                              </section>

                                                                                                                                <section class="card">
                                                                                                                                    <h2>เป้าหมายของฉัน</h2>
                                                                                                                                        <label for="goal">เป้าหมายที่อยากพัฒนา</label>
                                                                                                                                            <input id="goal" placeholder="เช่น ฝึกวางแผนเวลา">
                                                                                                                                                <button id="addGoal">＋ เพิ่มเป้าหมาย</button>
                                                                                                                                                    <div id="goals"></div>
                                                                                                                                                      </section>

                                                                                                                                                        <section class="card">
                                                                                                                                                            <h2>ภารกิจวันนี้</h2>
                                                                                                                                                                <div id="tasks"></div>
                                                                                                                                                                    <div class="bar"><div class="fill" id="progress" style="width:0%"></div></div>
                                                                                                                                                                        <p id="progressText">สำเร็จ 0/5 ภารกิจ</p>
                                                                                                                                                                          </section>

                                                                                                                                                                            <section class="card">
                                                                                                                                                                                <h2>ประวัติคะแนน</h2>
                                                                                                                                                                                    <div id="history">ยังไม่มีประวัติ</div>
                                                                                                                                                                                        <button id="backup">ดาวน์โหลดข้อมูลสำรอง</button>
                                                                                                                                                                                          </section>
                                                                                                                                                                                          </main>

                                                                                                                                                                                          <script>
                                                                                                                                                                                          const skillNames = [
                                                                                                                                                                                            "การคิดวิเคราะห์",
                                                                                                                                                                                              "การสื่อสาร",
                                                                                                                                                                                                "ความคิดสร้างสรรค์",
                                                                                                                                                                                                  "วินัยและการบริหารเวลา",
                                                                                                                                                                                                    "การเรียนรู้และปรับตัว"
                                                                                                                                                                                                    ];

                                                                                                                                                                                                    const taskNames = [
                                                                                                                                                                                                      "วางแผนสิ่งสำคัญ 3 อย่างของวันนี้",
                                                                                                                                                                                                        "เรียนรู้สิ่งใหม่ 10 นาที",
                                                                                                                                                                                                          "ฝึกอธิบายเรื่องที่สนใจ",
                                                                                                                                                                                                            "คิดวิธีแก้ปัญหาใหม่ 3 แบบ",
                                                                                                                                                                                                              "ทบทวนสิ่งที่ทำได้ดีวันนี้"
                                                                                                                                                                                                              ];

                                                                                                                                                                                                              const today = () => new Date().toLocaleDateString("sv-SE");

                                                                                                                                                                                                              function loadData() {
                                                                                                                                                                                                                try {
                                                                                                                                                                                                                    return JSON.parse(localStorage.getItem("strengthPath")) || {};
                                                                                                                                                                                                                      } catch {
                                                                                                                                                                                                                          return {};
                                                                                                                                                                                                                            }
                                                                                                                                                                                                                            }

                                                                                                                                                                                                                            let data = loadData();
                                                                                                                                                                                                                            data.scores = data.scores || [4,4,7,6,8];
                                                                                                                                                                                                                            data.goals = data.goals || [];
                                                                                                                                                                                                                            data.history = data.history || [];
                                                                                                                                                                                                                            data.tasks = data.tasks || {date:today(),done:[]};

                                                                                                                                                                                                                            if (data.tasks.date !== today()) {
                                                                                                                                                                                                                              data.tasks = {date:today(),done:[]};
                                                                                                                                                                                                                              }

                                                                                                                                                                                                                              function saveData() {
                                                                                                                                                                                                                                localStorage.setItem("strengthPath", JSON.stringify(data));
                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                function renderSkills() {
                                                                                                                                                                                                                                  const box = document.getElementById("skills");
                                                                                                                                                                                                                                    box.innerHTML = skillNames.map((name,i) => `
                                                                                                                                                                                                                                        <label>${name}: <b id="value${i}">${data.scores[i]}</b>/10</label>
                                                                                                                                                                                                                                            <input type="range" min="1" max="10" value="${data.scores[i]}" id="score${i}">
                                                                                                                                                                                                                                                <div class="bar"><div class="fill" style="width:${data.scores[i]*10}%"></div></div>
                                                                                                                                                                                                                                                  `).join("");

                                                                                                                                                                                                                                                    skillNames.forEach((_,i) => {
                                                                                                                                                                                                                                                        document.getElementById("score"+i).oninput = event => {
                                                                                                                                                                                                                                                              data.scores[i] = Number(event.target.value);
                                                                                                                                                                                                                                                                    document.getElementById("value"+i).textContent = data.scores[i];
                                                                                                                                                                                                                                                                          renderAverage();
                                                                                                                                                                                                                                                                              };
                                                                                                                                                                                                                                                                                });
                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                function renderAverage() {
                                                                                                                                                                                                                                                                                  const average = data.scores.reduce((a,b)=>a+b,0)/data.scores.length;
                                                                                                                                                                                                                                                                                    document.getElementById("average").textContent = average.toFixed(1)+" / 10";
                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                    function renderGoals() {
                                                                                                                                                                                                                                                                                      document.getElementById("goals").innerHTML = data.goals.map((goal,i)=>`
                                                                                                                                                                                                                                                                                          <div class="task">
                                                                                                                                                                                                                                                                                                <span>${escapeHTML(goal)}</span>
                                                                                                                                                                                                                                                                                                      <button onclick="deleteGoal(${i})">ลบ</button>
                                                                                                                                                                                                                                                                                                          </div>
                                                                                                                                                                                                                                                                                                            `).join("") || "<small>ยังไม่มีเป้าหมาย</small>";
                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                            function escapeHTML(value) {
                                                                                                                                                                                                                                                                                                              const element = document.createElement("span");
                                                                                                                                                                                                                                                                                                                element.textContent = value;
                                                                                                                                                                                                                                                                                                                  return element.innerHTML;
                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                  window.deleteGoal = index => {
                                                                                                                                                                                                                                                                                                                    data.goals.splice(index,1);
                                                                                                                                                                                                                                                                                                                      saveData();
                                                                                                                                                                                                                                                                                                                        renderGoals();
                                                                                                                                                                                                                                                                                                                        };

                                                                                                                                                                                                                                                                                                                        function renderTasks() {
                                                                                                                                                                                                                                                                                                                          document.getElementById("tasks").innerHTML = taskNames.map((task,i)=>`
                                                                                                                                                                                                                                                                                                                              <label class="task ${data.tasks.done.includes(i)?"done":""}">
                                                                                                                                                                                                                                                                                                                                    <input type="checkbox" data-task="${i}" ${data.tasks.done.includes(i)?"checked":""}>
                                                                                                                                                                                                                                                                                                                                          <span>${task}</span>
                                                                                                                                                                                                                                                                                                                                              </label>
                                                                                                                                                                                                                                                                                                                                                `).join("");

                                                                                                                                                                                                                                                                                                                                                  document.querySelectorAll("[data-task]").forEach(input=>{
                                                                                                                                                                                                                                                                                                                                                      input.onchange = () => {
                                                                                                                                                                                                                                                                                                                                                            const index = Number(input.dataset.task);
                                                                                                                                                                                                                                                                                                                                                                  data.tasks.done = input.checked
                                                                                                                                                                                                                                                                                                                                                                          ? [...new Set([...data.tasks.done,index])]
                                                                                                                                                                                                                                                                                                                                                                                  : data.tasks.done.filter(i=>i!==index);
                                                                                                                                                                                                                                                                                                                                                                                        saveData();
                                                                                                                                                                                                                                                                                                                                                                                              renderTasks();
                                                                                                                                                                                                                                                                                                                                                                                                  };
                                                                                                                                                                                                                                                                                                                                                                                                    });

                                                                                                                                                                                                                                                                                                                                                                                                      const count = data.tasks.done.length;
                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("progress").style.width = count/5*100+"%";
                                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById("progressText").textContent =
                                                                                                                                                                                                                                                                                                                                                                                                              `สำเร็จ ${count}/5 ภารกิจ`;
                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                              function renderHistory() {
                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById("history").innerHTML =
                                                                                                                                                                                                                                                                                                                                                                                                                    [...data.history].reverse().map(item=>`
                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="task">
                                                                                                                                                                                                                                                                                                                                                                                                                                  <div>
                                                                                                                                                                                                                                                                                                                                                                                                                                            <b>${escapeHTML(item.date)}</b><br>
                                                                                                                                                                                                                                                                                                                                                                                                                                                      คะแนนเฉลี่ย ${item.average}/10
                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        `).join("") || "ยังไม่มีประวัติ";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("saveScores").onclick = () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          data.history.push({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              date: today(),
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  average: (data.scores.reduce((a,b)=>a+b,0)/5).toFixed(1)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      saveData();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        renderHistory();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          alert("บันทึกคะแนนแล้ว!");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById("addGoal").onclick = () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const input = document.getElementById("goal");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const value = input.value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!value) return alert("กรุณาใส่เป้าหมายก่อน");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  data.goals.push(value);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    input.value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      saveData();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        renderGoals();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("backup").onclick = () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const blob = new Blob([JSON.stringify(data,null,2)], {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              type:"application/json"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const url = URL.createObjectURL(blob);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const a = document.createElement("a");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      a.href = url;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        a.download = "strength-path-backup.json";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          a.click();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            URL.revokeObjectURL(url);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            renderSkills();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            renderAverage();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            renderGoals();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            renderTasks();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            renderHistory();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
